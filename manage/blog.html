<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Blog Posts | Community Playlink</title>
    <meta
      name="description"
      content="Create, edit and remove Community Playlink noticeboard posts."
    />
    <link
      rel="icon"
      href="https://ik.imagekit.io/communityplaylink/website/head/cropped-Site-Icon-32x32.webp"
      sizes="32x32"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/pages/manage.css" />
  </head>
  <body class="manage-page">
    <div class="site-shell">
      <header class="header-band">
        <div class="container header-grid">
          <div></div>
          <a
            class="brand"
            href="/"
            aria-label="Community Playlink home"
          >
            <img
              src="https://ik.imagekit.io/communityplaylink/website/Community-Playlink-Logo-Retina-scaled.webp"
              style="width: 256px; height: 144px"
              alt="Community Playlink"
            />
          </a>
          <div></div>
        </div>
      </header>

      <main>
        <section class="section-pad manage-shell">
          <div class="container">
            <div class="manage-header">
              <div>
                <h1>Blog posts</h1>
                <p class="manage-account">
                  Signed in as <strong id="account-email">…</strong>
                </p>
              </div>
              <button id="logout-button" class="secondary-button" type="button">
                Log out
              </button>
            </div>

            <nav class="manage-subnav" aria-label="Management sections">
              <a href="./dashboard.html">Dashboard</a>
              <a href="./blog.html" class="is-active">Blog posts</a>
              <a href="./products.html">Products</a>
            </nav>

            <div
              id="status-banner"
              class="status-banner"
              data-state="info"
              aria-live="polite"
              hidden
            ></div>

            <div class="manage-card">
              <div class="manage-toolbar">
                <div class="manage-toolbar-title">
                  <h2>All posts</h2>
                  <button
                    id="refresh-posts-button"
                    class="manage-icon-button"
                    type="button"
                    aria-label="Refresh blog posts"
                    title="Refresh blog posts"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path
                        d="M20 12a8 8 0 1 1-2.34-5.66"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      />
                      <path
                        d="M20 4v6h-6"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      />
                    </svg>
                  </button>
                  <span
                    id="posts-last-refreshed"
                    class="manage-refresh-timestamp"
                    aria-live="polite"
                  >
                    Last refreshed: —
                  </span>
                </div>
                <button id="add-post-button" class="primary-button" type="button">
                  Add blog post
                </button>
              </div>

              <div class="manage-table-wrap">
                <div
                  id="posts-loading"
                  class="manage-loading"
                  role="status"
                  aria-live="polite"
                  hidden
                >
                  <span class="manage-spinner" aria-hidden="true"></span>
                  <span>Loading blog posts…</span>
                </div>
                <table class="manage-table">
                  <thead id="posts-table-head"></thead>
                  <tbody id="posts-table-body"></tbody>
                </table>
              </div>

              <div class="action-row manage-pagination manage-table-actions">
                <button
                  id="previous-page-button"
                  class="secondary-button"
                  type="button"
                >
                  Previous
                </button>
                <p id="pagination-status" class="manage-pagination-status" aria-live="polite"></p>
                <button id="next-page-button" class="secondary-button" type="button">
                  Next
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="post-modal" class="manage-modal" hidden>
      <div class="manage-modal-backdrop" data-close-modal></div>
      <div
        class="manage-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="post-modal-title"
      >
        <div class="manage-modal-header">
          <h2 id="post-modal-title">Add blog post</h2>
          <button
            class="manage-modal-close"
            type="button"
            data-close-modal
            aria-label="Close"
          >
            &times;
          </button>
        </div>

        <div
          id="form-status-banner"
          class="status-banner"
          data-state="info"
          aria-live="polite"
          hidden
        ></div>

        <form id="post-form" novalidate>
          <div id="post-form-fields" class="form-grid"></div>
          <div class="action-row">
            <button id="post-submit-button" class="primary-button" type="submit">
              Save post
            </button>
            <button class="secondary-button" type="button" data-close-modal>
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/manage-api.js"></script>
    <script src="../assets/js/manage-session.js"></script>
    <script src="../assets/js/manage-blog.js"></script>
  </body>
</html>
